<script>
  var IOS_URL  = 'https://apps.apple.com/app/id6771944449';
  var APK_URL  = '/coinprowl.apk';

  var ua = navigator.userAgent || navigator.vendor || '';
  var isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var isAndroid = /Android/i.test(ua);
  var iosBtn = document.getElementById('iosBtn');
  var playBtn = document.getElementById('playBtn');
  var redir = document.getElementById('redir');
  var sub = document.getElementById('sub');

  if (isIOS) {
    // iPhone/iPad: hide the Android option, send them to the App Store.
    playBtn.style.display = 'none';
    redir.textContent = 'Opening the App Store…';
    setTimeout(function(){ window.location.replace(IOS_URL); }, 400);
  } else if (isAndroid) {
    // Android: offer the direct APK download and explain the one-time setup.
    iosBtn.style.display = 'none';
    redir.textContent = 'Tap “Download for Android” to install CoinProwl.';
    sub.innerHTML = 'After it downloads, open the file to install. Your phone may ask you to allow installs from your browser the first time — that\'s normal for apps downloaded outside the Play Store.';
