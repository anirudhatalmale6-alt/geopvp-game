<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CoinProwl Admin</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0e1a;--surface:#111827;--surface2:#1a2235;--border:#1e293b;
  --primary:#00e5ff;--gold:#ffd700;--red:#ff1744;--green:#00e676;--purple:#7c4dff;
  --text:#fff;--text2:#9ca3af;--text3:#6b7280;
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;overflow:hidden;height:100vh}
a{color:var(--primary);text-decoration:none}

/* Layout */
.app{display:flex;height:100vh}
.sidebar{width:320px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}

/* Sidebar header */
.sidebar-header{padding:16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.sidebar-header h1{font-size:14px;letter-spacing:3px;font-weight:900;color:var(--primary)}
.sidebar-header .badge{font-size:9px;background:var(--primary);color:var(--bg);padding:2px 6px;border-radius:4px;font-weight:800;letter-spacing:1px}

/* Tabs */
.tabs{display:flex;border-bottom:1px solid var(--border)}
.tab{flex:1;padding:10px;text-align:center;font-size:11px;font-weight:700;letter-spacing:1px;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s}
.tab:hover{color:var(--text2)}
.tab.active{color:var(--primary);border-bottom-color:var(--primary)}

/* Panels */
.panel{display:none;flex:1;overflow-y:auto;padding:12px}
.panel.active{display:block}
.panel::-webkit-scrollbar{width:6px}
.panel::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* Stats cards */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.stat-card{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center}
.stat-value{font-size:28px;font-weight:900;color:var(--primary)}
.stat-value.gold{color:var(--gold)}
.stat-value.red{color:var(--red)}
.stat-value.green{color:var(--green)}
.stat-label{font-size:9px;color:var(--text3);letter-spacing:2px;font-weight:700;margin-top:2px}

/* Section headers */
.section-title{font-size:10px;letter-spacing:2px;color:var(--text3);font-weight:800;margin:16px 0 8px;text-transform:uppercase}

/* Coin drop controls */
.drop-controls{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:12px}
.drop-controls label{font-size:11px;color:var(--text2);font-weight:600;display:block;margin-bottom:4px}
.drop-controls input,.drop-controls select{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:8px 10px;border-radius:6px;font-size:13px;margin-bottom:8px;outline:none}
.drop-controls input:focus{border-color:var(--primary)}
.row{display:flex;gap:8px}
.row>*{flex:1}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:8px;font-size:12px;font-weight:800;letter-spacing:1px;border:none;cursor:pointer;transition:all .15s;width:100%}
.btn-primary{background:var(--primary);color:var(--bg)}
.btn-primary:hover{filter:brightness(1.15)}
.btn-gold{background:var(--gold);color:var(--bg)}
.btn-gold:hover{filter:brightness(1.15)}
.btn-danger{background:var(--red);color:#fff}
.btn-danger:hover{filter:brightness(1.15)}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text2)}
.btn-outline:hover{border-color:var(--primary);color:var(--primary)}
.btn-sm{padding:6px 10px;font-size:10px}

/* Drop list */
.drop-item{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;margin-bottom:4px}
.drop-item .coin-icon{width:28px;height:28px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;color:var(--bg);flex-shrink:0}
.drop-item .drop-info{flex:1;min-width:0}
.drop-item .drop-amount{font-weight:800;color:var(--gold);font-size:13px}
.drop-item .drop-coords{font-size:10px;color:var(--text3);font-family:monospace}
.drop-item .btn-x{width:24px;height:24px;border-radius:4px;background:transparent;border:1px solid var(--border);color:var(--text3);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;padding:0;flex-shrink:0}
.drop-item .btn-x:hover{border-color:var(--red);color:var(--red)}

/* Player list */
.player-item{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;margin-bottom:4px}
.player-avatar{width:32px;height:32px;border-radius:50%;background:var(--primary);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:var(--bg);flex-shrink:0}
.player-info{flex:1;min-width:0}
.player-name{font-weight:700;font-size:13px}
.player-meta{font-size:10px;color:var(--text3)}
.player-coins{font-weight:800;color:var(--gold);font-size:12px;flex-shrink:0}

/* User list */
.user-item{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;margin-bottom:4px}
.user-item .user-info{flex:1;min-width:0}
.user-item .user-name{font-weight:700;font-size:13px}
.user-item .user-email{font-size:10px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.admin-badge{font-size:8px;background:var(--purple);color:#fff;padding:1px 5px;border-radius:3px;font-weight:800;letter-spacing:0.5px}
.online-dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex-shrink:0}
.offline-dot{width:8px;height:8px;border-radius:50%;background:var(--text3);flex-shrink:0}

/* Map */
#admin-map{flex:1;background:var(--bg)}
.map-toolbar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--border)}
.map-toolbar .mode-label{font-size:11px;color:var(--text2);font-weight:600}
.map-toolbar .mode-btn{padding:6px 12px;border-radius:6px;font-size:11px;font-weight:700;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;letter-spacing:0.5px}
.map-toolbar .mode-btn.active{background:var(--gold);color:var(--bg);border-color:var(--gold)}
.map-toolbar .mode-btn:hover:not(.active){border-color:var(--primary);color:var(--primary)}
.map-info{margin-left:auto;font-size:11px;color:var(--text3)}

/* Toast */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--primary);color:var(--primary);padding:10px 20px;border-radius:8px;font-size:12px;font-weight:700;letter-spacing:1px;z-index:9999;opacity:0;transition:opacity .3s}
.toast.show{opacity:1}

/* Login overlay */
.login-overlay{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:10000}
.login-box{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:32px;width:360px;text-align:center}
.login-box h2{font-size:14px;letter-spacing:3px;color:var(--primary);font-weight:900;margin-bottom:4px}
.login-box p{font-size:12px;color:var(--text3);margin-bottom:20px}
.login-box input{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:10px;outline:none}
.login-box input:focus{border-color:var(--primary)}
.login-box .error{color:var(--red);font-size:11px;margin-bottom:8px}

/* Leaflet overrides */
.leaflet-control-attribution{display:none!important}
.coin-drop-marker{width:20px;height:20px;border-radius:50%;background:var(--gold);border:2px solid #ffb300;box-shadow:0 0 10px rgba(255,215,0,0.6);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:900;color:#0a0e1a;cursor:pointer}
.player-map-marker{width:12px;height:12px;border-radius:50%;background:var(--primary);border:2px solid var(--primary);box-shadow:0 0 8px rgba(0,229,255,0.5)}
.player-map-label{color:var(--primary);font-size:10px;font-weight:700;text-shadow:0 0 4px rgba(0,0,0,0.9);white-space:nowrap}

@media(max-width:768px){
  .sidebar{width:260px}
}
</style>
</head>
<body>

<!-- Login overlay -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <h2>COINPROWL</h2>
    <p>Admin Dashboard</p>
    <input type="email" id="loginEmail" placeholder="Email address">
    <input type="password" id="loginPassword" placeholder="Password">
    <div class="error" id="loginError"></div>
    <button class="btn btn-primary" onclick="doLogin()" style="margin-top:4px">LOGIN</button>
  </div>
</div>

<!-- App -->
<div class="app" id="app" style="display:none">
  <div class="sidebar">
    <div class="sidebar-header">
      <h1>COINPROWL</h1>
      <span class="badge">ADMIN</span>
    </div>
    <div class="tabs">
      <div class="tab active" data-tab="overview" onclick="switchTab('overview')">OVERVIEW</div>
      <div class="tab" data-tab="drops" onclick="switchTab('drops')">DROPS</div>
      <div class="tab" data-tab="players" onclick="switchTab('players')">PLAYERS</div>
      <div class="tab" data-tab="users" onclick="switchTab('users')">USERS</div>
    </div>

    <!-- Overview Panel -->
    <div class="panel active" id="panel-overview">
      <div class="stats-grid" id="statsGrid">
        <div class="stat-card"><div class="stat-value green" id="stat-online">-</div><div class="stat-label">ONLINE</div></div>
        <div class="stat-card"><div class="stat-value" id="stat-sessions">-</div><div class="stat-label">SESSIONS</div></div>
        <div class="stat-card"><div class="stat-value gold" id="stat-drops">-</div><div class="stat-label">COIN DROPS</div></div>
        <div class="stat-card"><div class="stat-value red" id="stat-users">-</div><div class="stat-label">TOTAL USERS</div></div>
      </div>
      <div class="section-title">QUICK ACTIONS</div>
      <button class="btn btn-gold" onclick="enableDropMode()" style="margin-bottom:8px">DROP COINS ON MAP</button>
      <button class="btn btn-danger btn-sm" onclick="clearAllDrops()" style="margin-bottom:8px">CLEAR ALL DROPS</button>
      <button class="btn btn-outline btn-sm" onclick="refreshAll()">REFRESH DATA</button>
    </div>

    <!-- Drops Panel -->
    <div class="panel" id="panel-drops">
      <div class="drop-controls">
        <label>DROP AMOUNT</label>
        <input type="number" id="dropAmount" value="5" min="1" max="1000">
        <label>DROP MODE</label>
        <div class="row" style="margin-bottom:8px">
          <button class="btn btn-gold btn-sm" onclick="enableDropMode()">CLICK TO DROP</button>
          <button class="btn btn-outline btn-sm" onclick="disableDropMode()">STOP</button>
        </div>
        <label>SCATTER DROP</label>
        <div class="row">
          <div>
            <label style="font-size:10px">Count</label>
            <input type="number" id="scatterCount" value="10" min="1" max="50">
          </div>
          <div>
            <label style="font-size:10px">Radius (m)</label>
            <input type="number" id="scatterRadius" value="500" min="50" max="5000">
          </div>
        </div>
        <button class="btn btn-primary btn-sm" onclick="scatterDrops()">SCATTER AROUND CENTER</button>
        <p style="font-size:9px;color:var(--text3);margin-top:4px">Click a point on the map first, then scatter</p>
      </div>
      <div class="section-title">ACTIVE DROPS (<span id="dropCount">0</span>)</div>
      <div id="dropsList"></div>
    </div>

    <!-- Players Panel -->
    <div class="panel" id="panel-players">
      <div class="section-title">ACTIVE PLAYERS (<span id="playerCount">0</span>)</div>
      <div id="playersList"></div>
    </div>

    <!-- Users Panel -->
    <div class="panel" id="panel-users">
      <div class="section-title">ALL USERS (<span id="userCount">0</span>)</div>
      <div id="usersList"></div>
    </div>
  </div>

  <div class="main">
    <div class="map-toolbar">
      <span class="mode-label">MODE:</span>
      <button class="mode-btn" id="modeView" onclick="disableDropMode()">VIEW</button>
      <button class="mode-btn" id="modeDrop" onclick="enableDropMode()">DROP COINS</button>
      <span class="map-info" id="mapInfo">Click map to place coins</span>
    </div>
    <div id="admin-map"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let TOKEN = localStorage.getItem('coinprowl_admin_token') || '';
let map, dropMode = false, lastClickLatLng = null;
let coinMarkers = {}, playerMapMarkers = {};

// ---- Auth ----
async function doLogin() {
  const email = document.getElementById('loginEmail').value;
  const password = document.getElementById('loginPassword').value;
  const errEl = document.getElementById('loginError');
  errEl.textContent = '';
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Login failed');
    TOKEN = data.token;
    localStorage.setItem('coinprowl_admin_token', TOKEN);
    // Verify admin access
    const statsRes = await apiFetch('/api/admin/stats');
    if (statsRes.error) throw new Error('Not an admin account');
    showApp();
  } catch (err) {
    errEl.textContent = err.message;
  }
}

function showApp() {
  document.getElementById('loginOverlay').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  initMap();
  refreshAll();
}

async function apiFetch(url, opts = {}) {
  const res = await fetch(url, {
    ...opts,
    headers: { 'Authorization': 'Bearer ' + TOKEN, 'Content-Type': 'application/json', ...(opts.headers || {}) },
  });
  if (res.status === 401 || res.status === 403) {
    localStorage.removeItem('coinprowl_admin_token');
    location.reload();
    return { error: 'Unauthorized' };
  }
  return res.json();
}

// ---- Init ----
if (TOKEN) {
  apiFetch('/api/admin/stats').then(data => {
    if (!data.error) showApp();
    else { TOKEN = ''; localStorage.removeItem('coinprowl_admin_token'); }
  });
}

// ---- Map ----
function initMap() {
  map = L.map('admin-map', { zoomControl: true }).setView([40.7128, -74.006], 14);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);
  map.on('click', onMapClick);
}

function onMapClick(e) {
  lastClickLatLng = e.latlng;
  document.getElementById('mapInfo').textContent = `${e.latlng.lat.toFixed(5)}, ${e.latlng.lng.toFixed(5)}`;
  if (dropMode) {
    const amount = parseInt(document.getElementById('dropAmount').value) || 5;
    placeDrop(e.latlng.lat, e.latlng.lng, amount);
  }
}

async function placeDrop(lat, lng, amount) {
  const data = await apiFetch('/api/admin/coins/drop', {
    method: 'POST',
    body: JSON.stringify({ latitude: lat, longitude: lng, amount }),
  });
  if (data.drop) {
    addCoinMarker(data.drop);
    toast(`Dropped ${amount} coins!`);
    refreshDrops();
  }
}

function addCoinMarker(drop) {
  if (coinMarkers[drop.id]) map.removeLayer(coinMarkers[drop.id]);
  const icon = L.divIcon({
    className: '',
    html: `<div class="coin-drop-marker">${drop.amount}</div>`,
    iconSize: [20, 20], iconAnchor: [10, 10],
  });
  const m = L.marker([drop.latitude, drop.longitude], { icon }).addTo(map);
  m.bindPopup(`<b>${drop.amount} coins</b><br><small>${drop.latitude.toFixed(5)}, ${drop.longitude.toFixed(5)}</small><br><button onclick="removeDrop('${drop.id}')" style="margin-top:4px;padding:2px 8px;background:#ff1744;color:#fff;border:none;border-radius:4px;cursor:pointer">Remove</button>`);
  coinMarkers[drop.id] = m;
}

function addPlayerMarker(player) {
  if (playerMapMarkers[player.userId]) map.removeLayer(playerMapMarkers[player.userId]);
  const icon = L.divIcon({
    className: '',
    html: `<div class="player-map-marker"></div><div class="player-map-label">${player.username}</div>`,
    iconSize: [12, 12], iconAnchor: [6, 6],
  });
  const m = L.marker([player.latitude, player.longitude], { icon }).addTo(map);
  m.bindPopup(`<b>${player.username}</b><br>${player.coinTier} tier — ${player.mapCoins} coins<br><small>${player.latitude.toFixed(5)}, ${player.longitude.toFixed(5)}</small>`);
  playerMapMarkers[player.userId] = m;
}

// ---- Drop mode ----
function enableDropMode() {
  dropMode = true;
  document.getElementById('modeDrop').classList.add('active');
  document.getElementById('modeView').classList.remove('active');
  document.getElementById('mapInfo').textContent = 'Click map to place coins';
  document.getElementById('admin-map').style.cursor = 'crosshair';
  switchTab('drops');
}

function disableDropMode() {
  dropMode = false;
  document.getElementById('modeView').classList.add('active');
  document.getElementById('modeDrop').classList.remove('active');
  document.getElementById('mapInfo').textContent = 'View mode';
  document.getElementById('admin-map').style.cursor = '';
}

// ---- Scatter drops ----
async function scatterDrops() {
  if (!lastClickLatLng) { toast('Click the map first to set center point'); return; }
  const count = parseInt(document.getElementById('scatterCount').value) || 10;
  const radiusM = parseInt(document.getElementById('scatterRadius').value) || 500;
  const amount = parseInt(document.getElementById('dropAmount').value) || 5;
  const degPerMeter = 1 / 111320;
  const drops = [];
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * 2 * Math.PI;
    const dist = Math.random() * radiusM;
    drops.push({
      latitude: lastClickLatLng.lat + dist * degPerMeter * Math.cos(angle),
      longitude: lastClickLatLng.lng + dist * degPerMeter * Math.sin(angle) / Math.cos(lastClickLatLng.lat * Math.PI / 180),
      amount,
    });
  }
  const data = await apiFetch('/api/admin/coins/bulk-drop', {
    method: 'POST',
    body: JSON.stringify({ drops }),
  });
  if (data.drops) {
    data.drops.forEach(d => addCoinMarker(d));
    toast(`Scattered ${data.count} coins!`);
    refreshDrops();
  }
}

// ---- Remove / clear drops ----
async function removeDrop(id) {
  await apiFetch(`/api/admin/coins/${id}`, { method: 'DELETE' });
  if (coinMarkers[id]) { map.removeLayer(coinMarkers[id]); delete coinMarkers[id]; }
  toast('Drop removed');
  refreshDrops();
}

async function clearAllDrops() {
  if (!confirm('Clear ALL active coin drops?')) return;
  const data = await apiFetch('/api/admin/coins', { method: 'DELETE' });
  Object.values(coinMarkers).forEach(m => map.removeLayer(m));
  coinMarkers = {};
  toast(`Cleared ${data.cleared || 0} drops`);
  refreshDrops();
  refreshStats();
}

// ---- Data refresh ----
async function refreshAll() {
  await Promise.all([refreshStats(), refreshDrops(), refreshPlayers(), refreshUsers()]);
}

async function refreshStats() {
  const data = await apiFetch('/api/admin/stats');
  if (data.error) return;
  document.getElementById('stat-online').textContent = data.onlinePlayers;
  document.getElementById('stat-sessions').textContent = data.activeSessions;
  document.getElementById('stat-drops').textContent = data.activeDrops;
  document.getElementById('stat-users').textContent = data.totalUsers;
}

async function refreshDrops() {
  const data = await apiFetch('/api/admin/coins');
  if (data.error) return;
  document.getElementById('dropCount').textContent = data.count;
  // Clear old markers
  Object.values(coinMarkers).forEach(m => map.removeLayer(m));
  coinMarkers = {};
  // Add new markers
  data.drops.forEach(d => addCoinMarker(d));
  // Update sidebar list
  const list = document.getElementById('dropsList');
  list.innerHTML = data.drops.map(d => `
    <div class="drop-item">
      <div class="coin-icon">${d.amount}</div>
      <div class="drop-info">
        <div class="drop-amount">${d.amount} coins</div>
        <div class="drop-coords">${d.latitude.toFixed(5)}, ${d.longitude.toFixed(5)}</div>
      </div>
      <button class="btn-x" onclick="removeDrop('${d.id}')">&times;</button>
    </div>
  `).join('');
}

async function refreshPlayers() {
  const data = await apiFetch('/api/admin/players');
  if (data.error) return;
  document.getElementById('playerCount').textContent = data.count;
  Object.values(playerMapMarkers).forEach(m => map.removeLayer(m));
  playerMapMarkers = {};
  data.players.forEach(p => addPlayerMarker(p));
  const list = document.getElementById('playersList');
  list.innerHTML = data.players.map(p => `
    <div class="player-item" onclick="map.setView([${p.latitude},${p.longitude}],16)" style="cursor:pointer">
      <div class="player-avatar">${p.username.substring(0,2).toUpperCase()}</div>
      <div class="player-info">
        <div class="player-name">${p.username} ${p.shieldActive ? '🛡️' : ''}</div>
        <div class="player-meta">${p.coinTier} tier — $${(p.buyinAmount/100).toFixed(0)} buy-in</div>
      </div>
      <div class="player-coins">${p.mapCoins} 🪙</div>
    </div>
  `).join('') || '<p style="color:var(--text3);font-size:12px;text-align:center;padding:20px">No active players</p>';
}

async function refreshUsers() {
  const data = await apiFetch('/api/admin/users');
  if (data.error) return;
  document.getElementById('userCount').textContent = data.count;
  const list = document.getElementById('usersList');
  list.innerHTML = data.users.map(u => `
    <div class="user-item">
      <div class="${u.activeSession ? 'online-dot' : 'offline-dot'}"></div>
      <div class="user-info">
        <div class="user-name">${u.username} ${u.isAdmin ? '<span class="admin-badge">ADMIN</span>' : ''}</div>
        <div class="user-email">${u.email}</div>
      </div>
      ${u.activeSession ? `<div class="player-coins">${u.activeSession.mapCoins} 🪙</div>` : ''}
    </div>
  `).join('');
}

// ---- Tabs ----
function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + name));
}

// ---- Toast ----
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}

// Auto-refresh every 30s
setInterval(() => { refreshStats(); refreshPlayers(); }, 30000);
