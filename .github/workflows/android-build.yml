name: Android Build

on:
  workflow_dispatch:

env:
  EXPO_NO_TELEMETRY: 1
  EXPO_PUBLIC_API_URL: https://api.coinprowl.com/api

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Set API URL
        working-directory: mobile
        run: echo "EXPO_PUBLIC_API_URL=$EXPO_PUBLIC_API_URL" > .env

      - name: Expo prebuild
        working-directory: mobile
        run: npx expo prebuild --platform android --clean

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo -n "$KEYSTORE_BASE64" | base64 --decode > mobile/android/app/coinprowl-release.keystore

      - name: Configure signing
        working-directory: mobile/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat >> gradle.properties << EOF
          COINPROWL_UPLOAD_STORE_FILE=coinprowl-release.keystore
          COINPROWL_UPLOAD_KEY_ALIAS=$KEY_ALIAS
          COINPROWL_UPLOAD_STORE_PASSWORD=$KEYSTORE_PASSWORD
          COINPROWL_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD
          EOF

      - name: Update build.gradle signing config
        working-directory: mobile/android/app
        run: |
          python3 << 'PYEOF'
          import re

          with open('build.gradle', 'r') as f:
              content = f.read()

          signing_config = '''
    signingConfigs {
        release {
            storeFile file("coinprowl-release.keystore")
            storePassword findProperty("COINPROWL_UPLOAD_STORE_PASSWORD") ?: ""
            keyAlias findProperty("COINPROWL_UPLOAD_KEY_ALIAS") ?: ""
            keyPassword findProperty("COINPROWL_UPLOAD_KEY_PASSWORD") ?: ""
        }
    }
'''
          # Insert signingConfigs right after "android {"
          content = content.replace('android {', 'android {' + signing_config, 1)

          # Replace signingConfig signingConfigs.debug with release in buildTypes
          content = content.replace('signingConfig signingConfigs.debug', 'signingConfig signingConfigs.release')

          with open('build.gradle', 'w') as f:
              f.write(content)

          print("build.gradle updated with release signing config")
          PYEOF

      - name: Build release APK
        working-directory: mobile/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Build release AAB (for Play Store)
        working-directory: mobile/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CoinProwl-Android-APK
          path: mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: CoinProwl-Android-AAB
          path: mobile/android/app/build/outputs/bundle/release/*.aab
          retention-days: 30
