name: iOS Build & TestFlight

on:
  workflow_dispatch:

env:
  EXPO_NO_TELEMETRY: 1

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Setup Ruby & CocoaPods
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: false

      - name: Install CocoaPods
        run: gem install cocoapods

      - name: Expo prebuild
        working-directory: mobile
        run: npx expo prebuild --platform ios --clean

      - name: Install pods
        working-directory: mobile/ios
        run: pod install

      - name: Install signing certificate
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/dist_cert.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          
          echo -n "$P12_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          PROFILE_PATH=$RUNNER_TEMP/coinprowl.mobileprovision
          echo -n "$PROFILE_BASE64" | base64 --decode -o $PROFILE_PATH
          
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< $(security cms -D -i $PROFILE_PATH))
          cp $PROFILE_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$PROFILE_UUID.mobileprovision
          echo "PROFILE_UUID=$PROFILE_UUID" >> $GITHUB_ENV

      - name: Update Xcode project signing
        working-directory: mobile/ios
        run: |
          PROJECT_NAME="CoinProwl"
          TEAM_ID="9Y84XURDU9"
          BUNDLE_ID="com.coinprowl.app"
          
          # Update project.pbxproj for manual signing
          sed -i '' "s/CODE_SIGN_IDENTITY = \".*\"/CODE_SIGN_IDENTITY = \"iPhone Distribution\"/g" "$PROJECT_NAME.xcodeproj/project.pbxproj"
          sed -i '' "s/DEVELOPMENT_TEAM = \".*\"/DEVELOPMENT_TEAM = \"$TEAM_ID\"/g" "$PROJECT_NAME.xcodeproj/project.pbxproj"
          sed -i '' "s/DEVELOPMENT_TEAM = .*;/DEVELOPMENT_TEAM = $TEAM_ID;/g" "$PROJECT_NAME.xcodeproj/project.pbxproj"
          sed -i '' "s/PROVISIONING_PROFILE_SPECIFIER = \".*\"/PROVISIONING_PROFILE_SPECIFIER = \"\"/g" "$PROJECT_NAME.xcodeproj/project.pbxproj"
          
          # Disable automatic signing
          sed -i '' 's/CODE_SIGN_STYLE = Automatic/CODE_SIGN_STYLE = Manual/g' "$PROJECT_NAME.xcodeproj/project.pbxproj"

      - name: Build archive
        working-directory: mobile/ios
        run: |
          xcodebuild archive \
            -workspace CoinProwl.xcworkspace \
            -scheme CoinProwl \
            -configuration Release \
            -archivePath $RUNNER_TEMP/CoinProwl.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            DEVELOPMENT_TEAM="9Y84XURDU9" \
            PROVISIONING_PROFILE="$PROFILE_UUID" \
            -allowProvisioningUpdates \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Export IPA
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>9Y84XURDU9</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.coinprowl.app</key>
              <string>${{ env.PROFILE_UUID }}</string>
            </dict>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST
          
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/CoinProwl.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/export

      - name: Upload to TestFlight
        env:
          ASC_KEY_BASE64: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: "9N5FFCA4C9"
          ASC_ISSUER_ID: "af651b63-096b-4071-b781-b421f383c27d"
        run: |
          ASC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8
          echo -n "$ASC_KEY_BASE64" | base64 --decode -o $ASC_KEY_PATH
          
          xcrun notarytool store-credentials "AC_PASSWORD" \
            --key $ASC_KEY_PATH \
            --key-id $ASC_KEY_ID \
            --issuer $ASC_ISSUER_ID 2>/dev/null || true
          
          xcrun altool --upload-app \
            --type ios \
            --file "$RUNNER_TEMP/export/CoinProwl.ipa" \
            --apiKey $ASC_KEY_ID \
            --apiIssuer $ASC_ISSUER_ID \
            --show-progress

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CoinProwl-iOS
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 30

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain $RUNNER_TEMP/app-signing.keychain-db 2>/dev/null || true
