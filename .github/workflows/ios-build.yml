name: iOS Build & TestFlight

on:
  workflow_dispatch:

env:
  EXPO_NO_TELEMETRY: 1
  EXPO_PUBLIC_API_URL: http://45.32.220.85/api

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode and install iOS platform
        run: |
          # List available Xcode versions
          ls /Applications/ | grep Xcode
          # Use latest Xcode (26.x) for iOS 26 SDK requirement
          XCODE_PATH=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_PATH" ]; then
            XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          fi
          echo "Using Xcode at: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version
          xcodebuild -downloadPlatform iOS || xcodebuild -downloadPlatform iOS || true
          xcodebuild -showsdks | grep -i ios

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Set API URL
        working-directory: mobile
        run: echo "EXPO_PUBLIC_API_URL=$EXPO_PUBLIC_API_URL" > .env

      - name: Expo prebuild
        working-directory: mobile
        run: npx expo prebuild --platform ios --clean

      - name: Install pods
        working-directory: mobile/ios
        run: pod install

      - name: Install signing certificate
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/dist_cert.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          
          echo -n "$P12_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          PROFILE_PATH=$RUNNER_TEMP/coinprowl.mobileprovision
          echo -n "$PROFILE_BASE64" | base64 --decode -o $PROFILE_PATH
          
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< $(security cms -D -i $PROFILE_PATH))
          cp $PROFILE_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$PROFILE_UUID.mobileprovision
          echo "PROFILE_UUID=$PROFILE_UUID" >> $GITHUB_ENV

      - name: Update Xcode project signing
        working-directory: mobile/ios
        run: |
          PROJECT_NAME="CoinProwl"
          TEAM_ID="9Y84XURDU9"
          BUNDLE_ID="com.coinprowl.app"
          
          # Update project.pbxproj for manual signing
          sed -i '' "s/CODE_SIGN_IDENTITY = \".*\"/CODE_SIGN_IDENTITY = \"iPhone Distribution\"/g" "$PROJECT_NAME.xcodeproj/project.pbxproj"
          sed -i '' "s/DEVELOPMENT_TEAM = \".*\"/DEVELOPMENT_TEAM = \"$TEAM_ID\"/g" "$PROJECT_NAME.xcodeproj/project.pbxproj"
          sed -i '' "s/DEVELOPMENT_TEAM = .*;/DEVELOPMENT_TEAM = $TEAM_ID;/g" "$PROJECT_NAME.xcodeproj/project.pbxproj"
          sed -i '' "s/PROVISIONING_PROFILE_SPECIFIER = \".*\"/PROVISIONING_PROFILE_SPECIFIER = \"\"/g" "$PROJECT_NAME.xcodeproj/project.pbxproj"
          
          # Disable automatic signing
          sed -i '' 's/CODE_SIGN_STYLE = Automatic/CODE_SIGN_STYLE = Manual/g' "$PROJECT_NAME.xcodeproj/project.pbxproj"

      - name: Build archive
        working-directory: mobile/ios
        run: |
          xcodebuild archive \
            -workspace CoinProwl.xcworkspace \
            -scheme CoinProwl \
            -configuration Release \
            -archivePath $RUNNER_TEMP/CoinProwl.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            DEVELOPMENT_TEAM="9Y84XURDU9" \
            PROVISIONING_PROFILE="$PROFILE_UUID" \
            -allowProvisioningUpdates \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Export IPA
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>9Y84XURDU9</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.coinprowl.app</key>
              <string>${{ env.PROFILE_UUID }}</string>
            </dict>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST
          
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/CoinProwl.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/export

      - name: Upload to TestFlight
        env:
          ASC_KEY_BASE64: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: "9N5FFCA4C9"
          ASC_ISSUER_ID: "af651b63-096b-4071-b781-b421f383c27d"
        run: |
          mkdir -p ~/private_keys
          echo -n "$ASC_KEY_BASE64" | base64 --decode -o ~/private_keys/AuthKey_${ASC_KEY_ID}.p8

          set -o pipefail
          xcrun altool --upload-app \
            --type ios \
            --file "$RUNNER_TEMP/export/CoinProwl.ipa" \
            --apiKey $ASC_KEY_ID \
            --apiIssuer $ASC_ISSUER_ID \
            --show-progress 2>&1 | tee /tmp/upload.log

          if grep -q "ERROR" /tmp/upload.log; then
            echo "Upload failed!"
            exit 1
          fi

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CoinProwl-iOS
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 30

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain $RUNNER_TEMP/app-signing.keychain-db 2>/dev/null || true
